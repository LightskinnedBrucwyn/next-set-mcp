name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r mcp/requirements-mcp.txt -r requirements-test.txt
      - run: .\.venv\Scripts\python.exe -m pip check
      - run: .\.venv\Scripts\python.exe -B -m unittest discover -s tests -q
      - run: node --test tests/test_userscript.cjs
      - run: .\.venv\Scripts\python.exe -B scripts/verify-local.py
